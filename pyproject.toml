[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uw-tool"
version = "1.0.0"
description = "Commercial Real Estate Underwriting CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pandas>=2",
    "openpyxl>=3.1",
    "pydantic>=2",
    "python-docx>=1.0",
    "pymupdf>=1.20",
    "numpy>=1.24",
]

[project.scripts]
uw = "uw.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["uw*"]
